<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="100%" height="100%" fill="none">
  <!-- Official Clima Social 4-Node Nexus Symbol -->
  <g transform="translate(5, 5)">
    <!-- SVG recreation of the authentic Clima Social 4-person swirl emblem -->
    <svg width="60" height="60" viewBox="0 0 500 500">
      <!-- Node Top (Coral Red #C23B49) -->
      <circle cx="250" cy="140" r="115" fill="#C23B49"/>
      <path d="M165 100C190 70 230 50 270 55C240 70 210 100 200 135C185 125 175 110 165 100Z" fill="#9E2533" opacity="0.4"/>
      
      <!-- Node Right (Slate Teal #4F7E90) -->
      <circle cx="360" cy="250" r="115" fill="#4F7E90"/>
      <path d="M400 165C430 190 450 230 445 270C430 240 400 210 365 200C375 185 390 175 400 165Z" fill="#365C6B" opacity="0.4"/>

      <!-- Node Bottom (Amber Gold #F0A200) -->
      <circle cx="250" cy="360" r="115" fill="#F0A200"/>
      <path d="M335 400C310 430 270 450 230 445C260 430 290 400 300 365C315 375 325 390 335 400Z" fill="#B87A00" opacity="0.4"/>

      <!-- Node Left (Deep Purple #40004F) -->
      <circle cx="140" cy="250" r="115" fill="#40004F"/>
      <path d="M100 335C70 310 50 270 55 230C70 260 100 290 135 300C125 315 110 325 100 335Z" fill="#280033" opacity="0.4"/>

      <!-- Central Pinwheel Nexus (White 4-point dynamic cut) -->
      <!-- Curves that carve the 4 inner circles -->
      <path d="M250 170C210 170 170 210 170 250C170 210 130 170 90 250C130 290 170 290 170 330C170 290 210 330 250 330C290 330 330 290 330 250C330 290 370 330 410 250C370 210 330 210 330 170C330 210 290 170 250 170Z" fill="#FFFFFF"/>
      <!-- Crisp center nexus star -->
      <path d="M250 155C240 210 210 240 155 250C210 260 240 290 250 345C260 290 290 260 345 250C290 240 260 210 250 155Z" fill="#FFFFFF"/>
      <circle cx="250" cy="250" r="42" fill="#FFFFFF"/>
    </svg>
  </g>

  <!-- Real Clima Social Typography -->
  <g transform="translate(76, 17)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-size="21" font-weight="900" letter-spacing="-0.03em" fill="#1E1627">CLIMA</text>
    <text x="75" y="20" font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif" font-size="21" font-weight="900" letter-spacing="-0.03em" fill="#C23B49">SOCIAL</text>
    <text x="1" y="36" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="0.12em" fill="#4F7E90">ESTUDIOS &amp; ASESORAMIENTO</text>
  </g>
</svg>
